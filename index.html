<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;
    background: #000;

    display: flex;
    flex-direction: column;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 0 18px;
    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;
    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;
    stroke: rgba(0,255,255,.35);
    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(calc(var(--r1) * -1));
}

.middle circle {
    fill: none;
    stroke: rgba(0,255,255,.65);
    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(calc(var(--r1) * -1));
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;
    font-weight: 300;

    letter-spacing: 10px;
    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;
    font-weight: 500;

    letter-spacing: 4px;
    color: rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;
    line-height: 1.4;

    text-align: center;

    color: rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 110px;

    overflow-y: auto;

    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;

    text-align: center;

    color: rgba(0,255,255,.95);

    white-space: pre-wrap;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;
    max-width: 520px;

    display: flex;
    align-items: flex-end;

    gap: 9px;

    padding-bottom: 15px;
}

.text-box {
    flex: 1;
    min-width: 0;

    min-height: 50px;
    max-height: 110px;

    resize: none;
    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding: 14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;
    font-size: 16px;
    line-height: 21px;
}

.text-box::placeholder {
    color: rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;
    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.send {
    border: none;
    background: #087cff;
    font-size: 24px;
}


/* =========================
   DOČASNÁ DIAGNOSTIKA
========================= */

#diagnostics {
    position: fixed;

    left: 8px;
    right: 8px;
    bottom: 75px;

    max-height: 190px;

    overflow-y: auto;

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(5,5,8,.95);

    border:
        1px solid
        rgba(0,255,255,.4);

    color:
        rgba(255,255,255,.75);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size: 10px;
    line-height: 1.45;

    z-index: 9999;

    display: block;

    -webkit-overflow-scrolling: touch;
}

.diag-title {
    color: cyan;
    font-size: 12px;
    margin-bottom: 6px;
}

.diag-ok {
    color: #55ffcc;
}

.diag-error {
    color: #ff5555;
}

.diag-warn {
    color: #ffd166;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>
</head>

<script type="module">

/* ==================================================
   DIAGNOSTIKA
================================================== */

const diagnostics =
    document.getElementById("diagnostics");

function log(message, type = "") {

    const line =
        document.createElement("div");

    const time =
        new Date().toLocaleTimeString("cs-CZ");

    line.textContent =
        "[" + time + "] " + message;

    if (type === "ok")
        line.className = "diag-ok";

    if (type === "error")
        line.className = "diag-error";

    if (type === "warn")
        line.className = "diag-warn";

    diagnostics.appendChild(line);

    diagnostics.scrollTop =
        diagnostics.scrollHeight;

    console.log("[JARVIS]", message);
}


/* ==================================================
   GLOBÁLNÍ CHYBY
================================================== */

window.addEventListener(
    "error",
    event => {

        log(
            "JS ERROR: " +
            event.message +
            " | " +
            event.filename +
            ":" +
            event.lineno +
            ":" +
            event.colno,
            "error"
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        log(
            "PROMISE ERROR: " +
            (
                event.reason?.stack ||
                event.reason?.message ||
                String(event.reason)
            ),
            "error"
        );
    }
);


/* ==================================================
   IMPORT WEBLLM
================================================== */

log(
    "Načítám WebLLM modul..."
);

let CreateMLCEngine;

try {

    const WebLLM =
        await import(
            "https://esm.run/@mlc-ai/web-llm"
        );

    CreateMLCEngine =
        WebLLM.CreateMLCEngine;

    if (!CreateMLCEngine) {

        throw new Error(
            "CreateMLCEngine nebyl nalezen."
        );
    }

    log(
        "WebLLM modul načten ✓",
        "ok"
    );

} catch (error) {

    log(
        "IMPORT WEBLLM SELHAL: " +
        (
            error?.stack ||
            error?.message ||
            String(error)
        ),
        "error"
    );

    document.getElementById("status")
        .textContent = "CHYBA WEBLLM";

    document.getElementById("response")
        .textContent =
            "WebLLM se nepodařilo načíst.";

    throw error;
}


/* ==================================================
   ELEMENTY
================================================== */

const core =
    document.getElementById("core");

const status =
    document.getElementById("status");

const response =
    document.getElementById("response");

const recognized =
    document.getElementById("recognized");

const textBox =
    document.getElementById("textBox");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* ==================================================
   KULIČKA
================================================== */

let rotation1 = 0;
let rotation2 = 0;
let lastTime = performance.now();

function animate(time) {

    const delta =
        (time - lastTime) / 1000;

    lastTime = time;

    rotation1 += 45 * delta;
    rotation2 -= 72 * delta;

    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            .55
        ) *
        .05;

    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );

    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );

    core.style.setProperty(
        "--pulse",
        pulse
    );

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* ==================================================
   WEBGPU
================================================== */

async function testWebGPU() {

    log(
        "Kontroluji WebGPU..."
    );

    if (!navigator.gpu) {

        log(
            "navigator.gpu NEEXISTUJE",
            "error"
        );

        throw new Error(
            "WebGPU není dostupné."
        );
    }

    log(
        "navigator.gpu OK",
        "ok"
    );

    let adapter;

    try {

        log(
            "Volám requestAdapter..."
        );

        adapter =
            await navigator.gpu.requestAdapter({
                powerPreference:
                    "high-performance"
            });

    } catch (error) {

        log(
            "requestAdapter ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );

        throw error;
    }

    if (!adapter) {

        log(
            "Adapter = null",
            "error"
        );

        throw new Error(
            "GPU adaptér nebyl nalezen."
        );
    }

    log(
        "GPU adapter OK ✓",
        "ok"
    );

    log(
        "Vendor: " +
        (adapter.info?.vendor || "unknown")
    );

    log(
        "Architecture: " +
        (adapter.info?.architecture || "unknown")
    );

    log(
        "Device: " +
        (adapter.info?.device || "unknown")
    );


    let device;

    try {

        log(
            "Volám requestDevice..."
        );

        device =
            await adapter.requestDevice();

    } catch (error) {

        log(
            "requestDevice ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );

        throw error;
    }

    if (!device) {

        throw new Error(
            "GPU device nebyl vytvořen."
        );
    }

    log(
        "GPU device OK ✓",
        "ok"
    );


    try {

        const buffer =
            device.createBuffer({

                size: 256,

                usage:
                    GPUBufferUsage.STORAGE |
                    GPUBufferUsage.COPY_DST

            });

        buffer.destroy();

        log(
            "GPU buffer test OK ✓",
            "ok"
        );

    } catch (error) {

        log(
            "GPU buffer ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );

        throw error;
    }


    log(
        "WEBGPU CELKEM OK ✓",
        "ok"
    );

    return true;
}


/* ==================================================
   MODEL
================================================== */

let engine = null;
let modelReady = false;
let loading = false;


/*
   TENTO MODEL JE ZÁMĚRNĚ MALÝ.
*/

const MODEL =
    "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";


/* ==================================================
   NAČÍTÁNÍ MODELU
================================================== */

async function loadModel() {

    if (loading) {

        log(
            "loadModel už běží.",
            "warn"
        );

        return;
    }

    if (modelReady) {

        log(
            "Model už je načten.",
            "ok"
        );

        return;
    }

    loading = true;

    status.textContent =
        "NAČÍTÁM MOZEK";

    response.textContent =
        "Načítám lokální AI…";


    log(
        "--------------------------------"
    );

    log(
        "ZAČÍNÁ NAČÍTÁNÍ MODELU"
    );

    log(
        "Model: " + MODEL
    );

    log(
        "WebLLM CreateMLCEngine = OK",
        "ok"
    );


    try {

        log(
            "Volám CreateMLCEngine..."
        );

        engine =
            await CreateMLCEngine(
                MODEL,
                {

                    initProgressCallback:
                    progress => {

                        try {

                            const text =
                                progress?.text ||
                                "bez textu";

                            const value =
                                progress?.progress;


                            if (
                                typeof value ===
                                "number"
                            ) {

                                const percent =
                                    Math.round(
                                        value * 100
                                    );

                                log(
                                    "PROGRESS " +
                                    percent +
                                    "% | " +
                                    text
                                );

                                status.textContent =
                                    "MOZEK " +
                                    percent +
                                    "%";

                                response.textContent =
                                    "Načítám lokální AI…\n" +
                                    percent +
                                    "%";

                            } else {

                                log(
                                    "PROGRESS | " +
                                    text
                                );
                            }

                        } catch (progressError) {

                            log(
                                "Progress callback ERROR: " +
                                (
                                    progressError?.message ||
                                    String(progressError)
                                ),
                                "error"
                            );
                        }
                    }

                }
            );


        log(
            "CreateMLCEngine dokončeno ✓",
            "ok"
        );


        if (!engine) {

            throw new Error(
                "CreateMLCEngine vrátil prázdný engine."
            );
        }


        log(
            "Engine existuje ✓",
            "ok"
        );


        modelReady = true;


        status.textContent =
            "JARVIS PŘIPRAVEN";

        response.textContent =
            "Lokální AI je připravená.";


        log(
            "MODEL ÚSPĚŠNĚ NAČTEN ✓",
            "ok"
        );

        log(
            "JARVIS JE PŘIPRAVEN ✓",
            "ok"
        );


    } catch (error) {

        modelReady = false;

        status.textContent =
            "CHYBA MODELU";

        response.textContent =
            "Lokální model se nepodařilo načíst.";

        log(
            "MODEL ERROR:",
            "error"
        );

        log(
            error?.stack ||
            error?.message ||
            String(error),
            "error"
        );

        console.error(
            "JARVIS MODEL ERROR",
            error
        );

    } finally {

        loading = false;

        log(
            "loadModel() skončeno."
        );
    }
}


/* ==================================================
   ODPOVĚĎ
================================================== */

async function askJarvis(text) {

    if (!text)
        return;

    recognized.textContent =
        text;

    if (!modelReady) {

        response.textContent =
            "Mozek ještě není připraven.";

        log(
            "Dotaz odmítnut – model není připraven.",
            "warn"
        );

        return;
    }


    status.textContent =
        "JARVIS PŘEMÝŠLÍ";

    response.textContent =
        "Přemýšlím…";


    log(
        "Odesílám dotaz modelu..."
    );


    try {

        const result =
            await engine.chat.completions.create({

                messages: [

                    {
                        role: "system",

                        content:
                            "Jsi JARVIS, osobní AI asistent. " +
                            "Vždy odpovídej česky. " +
                            "Odpovídej přirozeně, stručně a srozumitelně. " +
                            "Nevymýšlej nesmyslné odpovědi. " +
                            "Když neznáš odpověď, řekni to."
                    },

                    {
                        role: "user",
                        content: text
                    }

                ],

                temperature: 0.5,

                max_tokens: 180

            });


        const answer =
            result
            ?.choices?.[0]
            ?.message?.content
            ?.trim();


        if (!answer) {

            throw new Error(
                "Model nevrátil žádnou odpověď."
            );
        }


        response.textContent =
            answer;

        status.textContent =
            "JARVIS ODPOVÍDÁ";


        log(
            "Odpověď přijata ✓",
            "ok"
        );


        speak(answer);


    } catch (error) {

        status.textContent =
            "CHYBA ODPOVĚDI";

        response.textContent =
            "Nepodařilo se získat odpověď.";


        log(
            "INFERENCE ERROR: " +
            (
                error?.stack ||
                error?.message ||
                String(error)
            ),
            "error"
        );
    }
}


/* ==================================================
   TEXT
================================================== */

sendButton.addEventListener(
    "click",
    async () => {

        const text =
            textBox.value.trim();

        if (!text)
            return;

        textBox.value = "";

        await askJarvis(text);
    }
);


textBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* ==================================================
   MIKROFON
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "cs-CZ";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening = true;

        status.textContent =
            "POSLOUCHÁM";

        micButton.classList.add(
            "listening"
        );

        log(
            "Mikrofon spuštěn."
        );
    };


    recognition.onresult =
    event => {

        let text = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            text +=
                event.results[i][0]
                .transcript;
        }


        if (text.trim()) {

            recognized.textContent =
                text;

            const last =
                event.results[
                    event.results.length - 1
                ];

            if (last.isFinal) {

                askJarvis(
                    text.trim()
                );
            }
        }
    };


    recognition.onend =
    () => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        if (modelReady) {

            status.textContent =
                "JARVIS PŘIPRAVEN";
        }

        log(
            "Mikrofon ukončen."
        );
    };


    recognition.onerror =
    event => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        log(
            "MIC ERROR: " +
            event.error,
            "error"
        );
    };
}


micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            response.textContent =
                "Diktování není v tomto prohlížeči dostupné.";

            log(
                "SpeechRecognition není dostupný.",
                "warn"
            );

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                log(
                    "MIC START ERROR: " +
                    (
                        error?.message ||
                        String(error)
                    ),
                    "error"
                );
            }
        }
    }
);


/* ==================================================
   HLAS
================================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    )
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "cs-CZ";

    utterance.rate =
        0.48;

    utterance.pitch =
        0.85;

    utterance.volume =
        1.0;

    speechSynthesis.speak(
        utterance
    );
}


/* ==================================================
   START
================================================== */

async function startJarvis() {

    log(
        "================================"
    );

    log(
        "JARVIS START"
    );

    log(
        "Prohlížeč: " +
        navigator.userAgent
    );

    log(
        "WebGPU: " +
        (
            navigator.gpu
                ? "dostupné"
                : "nedostupné"
        )
    );


    try {

        status.textContent =
            "TESTUJI GPU";

        response.textContent =
            "Kontroluji WebGPU…";


        await testWebGPU();


        status.textContent =
            "NAČÍTÁM MOZEK";

        response.textContent =
            "Připravuji lokální AI…";


        await loadModel();


    } catch (error) {

        status.textContent =
            "CHYBA";

        response.textContent =
            error?.message ||
            String(error);


        log(
            "START ERROR: " +
            (
                error?.stack ||
                error?.message ||
                String(error)
            ),
            "error"
        );
    }
}


startJarvis();

</script>
