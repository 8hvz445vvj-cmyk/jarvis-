<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black">

<meta name="apple-mobile-web-app-title"
content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 0 18px;

    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;

    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;

    stroke:
        rgba(0,255,255,.35);

    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.middle circle {
    fill: none;

    stroke:
        rgba(0,255,255,.65);

    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: 10px;

    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;

    color:
        rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 110px;

    overflow-y: auto;

    font-size: 18px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(0,255,255,.95);

    white-space: pre-wrap;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;

    max-width: 520px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    padding-bottom: 15px;
}

.text-box {
    flex: 1;

    min-width: 0;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding:
        14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;

    font-size: 16px;

    line-height: 21px;
}

.text-box::placeholder {
    color:
        rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.send {
    border: none;

    background:
        #087cff;

    font-size: 24px;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>
</head>

<script type="module">

/* ==================================================
   JARVIS
   WLLAMA + QWEN2.5 3B
================================================== */

import {
    Wllama
} from "https://esm.sh/@wllama/wllama@3.6.1";

import WasmFromCDN from
"https://esm.sh/@wllama/wllama@3.6.1/esm/wasm-from-cdn.js";


/* ==================================================
   ELEMENTY
================================================== */

const core =
document.getElementById("core");

const status =
document.getElementById("status");

const response =
document.getElementById("response");

const recognized =
document.getElementById("recognized");

const textBox =
document.getElementById("textBox");

const sendButton =
document.getElementById("sendButton");

const micButton =
document.getElementById("micButton");


/* ==================================================
   ANIMACE
================================================== */

let rotation1 = 0;

let rotation2 = 0;

let lastTime =
performance.now();


function animate(time) {

    const delta =
        (time - lastTime) / 1000;

    lastTime = time;

    rotation1 +=
        45 * delta;

    rotation2 -=
        72 * delta;

    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            .55
        ) *
        .05;

    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );

    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );

    core.style.setProperty(
        "--pulse",
        pulse
    );

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);


/* ==================================================
   WLLAMA
================================================== */

let wllama = null;

let modelReady = false;

let loading = false;


/*
 * Menší 986 MB distribuce.
 *
 * Repo:
 * second-state/Qwen2.5-3B-Instruct-GGUF
 *
 * Model:
 * Qwen2.5-3B-Instruct-Q4_K_M.gguf
 */

const MODEL_REPO =
    "second-state/Qwen2.5-3B-Instruct-GGUF";

const MODEL_FILE =
    "Qwen2.5-3B-Instruct-Q4_K_M.gguf";


/* ==================================================
   NAČTENÍ MODELU
================================================== */

async function loadModel() {

    if (loading || modelReady)
        return;

    loading = true;

    status.textContent =
        "NAČÍTÁM MOZEK";

    response.textContent =
        "Připravuji lokální AI…";


    try {

        /*
         * CDN WASM konfigurace.
         *
         * Wllama používá WebGPU automaticky
         * v podporovaném prostředí.
         */

        wllama =
            new Wllama(
                WasmFromCDN,
                {
                    parallelDownloads: 2,
                    allowOffline: true
                }
            );


        /*
         * Na iPhonu nezačínáme s plným
         * GPU offloadem.
         *
         * 4 vrstvy = výrazně menší
         * nárok na GPU paměť.
         */

        await wllama.loadModelFromHF(
            {
                repo:
                    MODEL_REPO,

                file:
                    MODEL_FILE
            },
            {

                n_gpu_layers: 4,

                n_ctx: 1024,

                n_batch: 32,

                n_threads: 2,

                progressCallback:
                    ({ loaded, total }) => {

                        if (
                            total > 0
                        ) {

                            const percent =
                                Math.round(
                                    (
                                        loaded /
                                        total
                                    ) * 100
                                );

                            status.textContent =
                                "MOZEK " +
                                percent +
                                "%";

                            response.textContent =
                                "Načítám lokální AI…\n" +
                                percent +
                                "%";
                        }
                    }
            }
        );


        modelReady = true;

        loading = false;

        status.textContent =
            "JARVIS PŘIPRAVEN";

        response.textContent =
            "Lokální AI je připravená.";


    } catch (error) {

        loading = false;

        modelReady = false;

        console.error(
            "Wllama error:",
            error
        );

        status.textContent =
            "CHYBA MODELU";

        response.textContent =
            "Model se nepodařilo spustit.\n\n" +
            (
                error?.message ||
                String(error)
            );
    }
}


/* ==================================================
   JARVIS ODPOVĚĎ
================================================== */

async function askJarvis(text) {

    if (!text)
        return;

    recognized.textContent =
        text;


    if (!modelReady) {

        response.textContent =
            "Mozek ještě není připraven.";

        return;
    }


    status.textContent =
        "JARVIS PŘEMÝŠLÍ";

    response.textContent =
        "Přemýšlím…";


    try {

        const result =
            await wllama.createChatCompletion(
                {

                    messages: [

                        {
                            role: "system",

                            content:
                                "Jsi JARVIS, osobní AI asistent. " +
                                "Odpovídej vždy česky. " +
                                "Buď stručný, přirozený a přesný. " +
                                "Nikdy nevymýšlej nesmyslné věty. " +
                                "Pokud něco nevíš, řekni to."
                        },

                        {
                            role: "user",

                            content:
                                text
                        }

                    ],

                    temperature:
                        0.5,

                    top_k:
                        40,

                    top_p:
                        0.9,

                    max_tokens:
                        120
                }
            );


        const answer =
            result
            ?.choices?.[0]
            ?.message?.content
            ?.trim();


        if (!answer) {

            throw new Error(
                "Model nevrátil odpověď."
            );
        }


        response.textContent =
            answer;

        status.textContent =
            "JARVIS ODPOVÍDÁ";


        speak(answer);


    } catch (error) {

        console.error(
            "Inference error:",
            error
        );

        status.textContent =
            "CHYBA ODPOVĚDI";

        response.textContent =
            "Nepodařilo se získat odpověď.";
    }
}


/* ==================================================
   TEXT
================================================== */

sendButton.addEventListener(
    "click",
    async () => {

        const text =
            textBox.value.trim();

        if (!text)
            return;

        textBox.value = "";

        await askJarvis(text);
    }
);


textBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* ==================================================
   MIKROFON
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "cs-CZ";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening = true;

        status.textContent =
            "POSLOUCHÁM";

        micButton.classList.add(
            "listening"
        );
    };


    recognition.onresult =
    event => {

        let text = "";


        for (
            let i =
                event.resultIndex;

            i <
                event.results.length;

            i++
        ) {

            text +=
                event.results[i][0]
                .transcript;
        }


        if (text.trim()) {

            recognized.textContent =
                text;


            const last =
                event.results[
                    event.results.length - 1
                ];


            if (
                last.isFinal
            ) {

                askJarvis(
                    text.trim()
                );
            }
        }
    };


    recognition.onend =
    () => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        if (modelReady) {

            status.textContent =
                "JARVIS PŘIPRAVEN";
        }
    };


    recognition.onerror =
    event => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        console.error(
            "Microphone:",
            event.error
        );
    };
}


micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            response.textContent =
                "Diktování není v tomto prohlížeči dostupné.";

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                console.error(
                    error
                );
            }
        }
    }
);


/* ==================================================
   ČESKÝ HLAS
================================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    )
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "cs-CZ";

    utterance.rate =
        0.55;

    utterance.pitch =
        0.85;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );
}


/* ==================================================
   START
================================================== */

async function startJarvis() {

    status.textContent =
        "PŘIPRAVUJI MOZEK";

    response.textContent =
        "Načítám lokální AI…";


    await loadModel();
}


startJarvis();

</script>
