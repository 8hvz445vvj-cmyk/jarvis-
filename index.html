<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black">

<meta name="apple-mobile-web-app-title"
content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 0 18px;

    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;

    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;

    stroke:
        rgba(0,255,255,.35);

    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.middle circle {
    fill: none;

    stroke:
        rgba(0,255,255,.65);

    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: 10px;

    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;

    color:
        rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 100px;

    overflow-y: auto;

    font-size: 17px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(0,255,255,.95);

    white-space: pre-wrap;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;

    max-width: 520px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    padding-bottom: 12px;
}

.text-box {
    flex: 1;

    min-width: 0;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding:
        14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;

    font-size: 16px;

    line-height: 21px;
}

.text-box::placeholder {
    color:
        rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.send {
    border: none;

    background:
        #087cff;

    font-size: 24px;
}


/* =========================
   DIAGNOSTIKA
========================= */

#diagnostic {

    position: fixed;

    left: 10px;
    right: 10px;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 75px
        );

    z-index: 100;

    max-height: 90px;

    overflow-y: auto;

    padding: 8px 10px;

    border-radius: 12px;

    background:
        rgba(10,10,10,.88);

    border:
        1px solid
        rgba(0,255,255,.25);

    color:
        rgba(0,255,255,.85);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size: 10px;

    line-height: 1.45;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    white-space: pre-wrap;

    pointer-events: none;
}

.diag-ok {
    color:
        rgba(0,255,150,.9);
}

.diag-error {
    color:
        rgba(255,80,80,.95);
}

.diag-info {
    color:
        rgba(0,200,255,.9);
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>
</head>


<body>

<div class="app">

<div class="main">

<div class="top-space"></div>


<!-- JARVIS CORE -->

<div
class="core"

<svg

</svg>


<svg

>

stroke-width="2"

stroke-dasharray="125 875"

<svg

<circle

stroke-width="3"

stroke-dashoffset="-780"
pathLength="1000"
/>

</svg>


<svg
class="ring middle"
viewBox="0 0 205 205"
>

<circle
cx="102.5"
cy="102.5"
r="100"
/>

</svg>


<svg
class="ring inner"
viewBox="0 0 190 190"
>

<circle
cx="95"
cy="95"
r="92"
fill="none"
stroke="rgba(0,120,255,.9)"
stroke-width="4"
stroke-linecap="round"
stroke-dasharray="150 850"
stroke-dashoffset="-120"
pathLength="1000"
/>

</svg>


<svg
class="ring inner-2"
viewBox="0 0 190 190"
>

<circle

r="92"

stroke-width="2"

/>

<div class="input-area">

/>

/>

/>

</svg>

id="sendButton"

>
↑

<!-- DIAGNOSTICKÝ PANEL -->

<div id="diagnostic">
Spouštím diagnostiku…
</div>


<script>

/* ==================================================
   DIAGNOSTICKÝ SYSTÉM
================================================== */

const diagnostic =
document.getElementById("diagnostic");


function diag(
    message,
    type = "info"
) {

    const time =
        new Date()
            .toLocaleTimeString(
                "cs-CZ"
            );

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "diag-" + type;

    line.textContent =
        "[" +
        time +
        "] " +
        message;

    diagnostic.appendChild(
        line
    );

    diagnostic.scrollTop =
        diagnostic.scrollHeight;

    console.log(
        "[JARVIS]",
        message
    );
}


/* Zachycení JavaScript chyb */

window.addEventListener(
    "error",
    event => {

        diag(
            "JS CHYBA: " +
            event.message +
            " (" +
            event.filename +
            ":" +
            event.lineno +
            ")",
            "error"
        );
    }
);


/* Zachycení odmítnutých Promise */

window.addEventListener(
    "unhandledrejection",
    event => {

        diag(
            "PROMISE CHYBA: " +
            (
                event.reason?.message ||
                String(event.reason)
            ),
            "error"
        );
    }
);


/* ==================================================
   JARVIS KULIČKA
================================================== */

const core =
document.getElementById("core");

let rotation1 = 0;

let rotation2 = 0;

let lastTime =
performance.now();


function animate(time) {

    const delta =
        (time - lastTime) / 1000;

    lastTime = time;


    rotation1 +=
        45 * delta;

    rotation2 -=
        72 * delta;


    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            .55
        ) *
        .05;


    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );

    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );

    core.style.setProperty(
        "--pulse",
        pulse
    );


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


/* ==================================================
   ZÁKLADNÍ TESTY
================================================== */

const status =
document.getElementById("status");

const response =
document.getElementById("response");

const recognized =
document.getElementById("recognized");


diag(
    "JavaScript funguje ✓",
    "ok"
);


/* DOM */

if (
    document.getElementById("core") &&
    document.getElementById("textBox") &&
    document.getElementById("micButton") &&
    document.getElementById("sendButton")
) {

    diag(
        "DOM prvky JARVISe OK ✓",
        "ok"
    );

} else {

    diag(
        "Některý DOM prvek chybí.",
        "error"
    );
}


/* ==================================================
   WEBGPU
================================================== */

async function testWebGPU() {

    diag(
        "Kontroluji WebGPU…",
        "info"
    );


    if (
        !navigator.gpu
    ) {

        status.textContent =
            "WEBGPU CHYBÍ";

        response.textContent =
            "WebGPU není dostupné.";

        diag(
            "navigator.gpu NEEXISTUJE",
            "error"
        );

        return;
    }


    diag(
        "navigator.gpu OK ✓",
        "ok"
    );


    try {

        const adapter =
            await navigator.gpu.requestAdapter({
                powerPreference:
                    "high-performance"
            });


        if (!adapter) {

            status.textContent =
                "CHYBA ADAPTÉRU";

            response.textContent =
                "WebGPU adaptér nebyl nalezen.";

            diag(
                "GPU adaptér nebyl nalezen.",
                "error"
            );

            return;
        }


        diag(
            "GPU adaptér OK ✓",
            "ok"
        );


        const device =
            await adapter.requestDevice();


        if (!device) {

            status.textContent =
                "CHYBA DEVICE";

            response.textContent =
                "GPU device se nepodařilo vytvořit.";

            diag(
                "GPU device CHYBA.",
                "error"
            );

            return;
        }


        diag(
            "GPU device OK ✓",
            "ok"
        );


        const buffer =
            device.createBuffer({

                size: 256,

                usage:
                    GPUBufferUsage.STORAGE |
                    GPUBufferUsage.COPY_DST
            });


        buffer.destroy();


        diag(
            "GPU buffer test OK ✓",
            "ok"
        );


        status.textContent =
            "WEBGPU FUNGUJE ✓";

        response.textContent =
            "WebGPU diagnostika dokončena.";


        /*
         * Informace o GPU.
         */

        try {

            const info =
                adapter.info;


            if (info) {

                if (
                    info.vendor
                ) {

                    diag(
                        "GPU vendor: " +
                        info.vendor
                    );
                }


                if (
                    info.architecture
                ) {

                    diag(
                        "GPU architecture: " +
                        info.architecture
                    );
                }


                if (
                    info.device
                ) {

                    diag(
                        "GPU device: " +
                        info.device
                    );
                }
            }

        } catch(error) {

            diag(
                "GPU info není dostupné.",
                "info"
            );
        }


        diag(
            "WEBGPU TEST CELKEM OK ✓",
            "ok"
        );


    } catch(error) {

        status.textContent =
            "WEBGPU CHYBA";

        response.textContent =
            "WebGPU test selhal.";

        diag(
            "WEBGPU CHYBA: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );
    }
}


/* ==================================================
   PSANÍ
================================================== */

const textBox =
document.getElementById("textBox");

const sendButton =
document.getElementById("sendButton");


sendButton.addEventListener(
    "click",
    () => {

        const text =
            textBox.value.trim();


        if (!text) {

            diag(
                "Odeslání prázdného textu.",
                "info"
            );

            return;
        }


        recognized.textContent =
            text;


        response.textContent =
            "Diagnostika: textový vstup funguje ✓";


        diag(
            "Textový vstup OK ✓",
            "ok"
        );


        textBox.value =
            "";
    }
);


/* Enter = odeslat */

textBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* ==================================================
   MIKROFON
================================================== */

const micButton =
document.getElementById("micButton");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition =
    null;

let isListening =
    false;


if (SpeechRecognition) {

    diag(
        "Speech Recognition API OK ✓",
        "ok"
    );


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "cs-CZ";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening =
            true;


        status.textContent =
            "POSLOUCHÁM";


        micButton.classList.add(
            "listening"
        );


        diag(
            "Mikrofon spuštěn ✓",
            "ok"
        );
    };


    recognition.onresult =
    event => {

        let text =
            "";


        for (
            let i =
                event.resultIndex;

            i <
                event.results.length;

            i++
        ) {

            text +=
                event.results[i][0]
                    .transcript;
        }


        if (
            text.trim()
        ) {

            recognized.textContent =
                text;


            diag(
                "Rozpoznaný text: " +
                text,
                "ok"
            );
        }
    };


    recognition.onend =
    () => {

        isListening =
            false;


        micButton.classList.remove(
            "listening"
        );


        status.textContent =
            "WEBGPU FUNGUJE ✓";


        diag(
            "Mikrofon ukončen.",
            "info"
        );
    };


    recognition.onerror =
    event => {

        isListening =
            false;


        micButton.classList.remove(
            "listening"
        );


        diag(
            "MIKROFON CHYBA: " +
            event.error,
            "error"
        );
    };


} else {

    diag(
        "Speech Recognition API není dostupné.",
        "info"
    );
}


micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            response.textContent =
                "Rozpoznávání řeči není v tomto prohlížeči dostupné.";

            diag(
                "Nelze spustit mikrofon – API chybí.",
                "error"
            );

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            recognized.textContent =
                "POSLOUCHÁM…";


            try {

                recognition.start();

            } catch(error) {

                diag(
                    "MIKROFON START CHYBA: " +
                    (
                        error?.message ||
                        String(error)
                    ),
                    "error"
                );
            }
        }
    }
);


/* ==================================================
   START
================================================== */

diag(
    "JARVIS diagnostika spuštěna ✓",
    "ok"
);


testWebGPU();

</script>
