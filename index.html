<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black">

<meta name="apple-mobile-web-app-title"
content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 0 18px;

    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;

    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;

    stroke:
        rgba(0,255,255,.35);

    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.middle circle {
    fill: none;

    stroke:
        rgba(0,255,255,.65);

    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: 10px;

    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;

    color:
        rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 110px;

    overflow-y: auto;

    font-size: 18px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(0,255,255,.95);

    white-space: pre-wrap;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;

    max-width: 520px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    padding-bottom: 15px;
}

.text-box {
    flex: 1;

    min-width: 0;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding:
        14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;

    font-size: 16px;

    line-height: 21px;
}

.text-box::placeholder {
    color:
        rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.send {
    border: none;

    background:
        #087cff;

    font-size: 24px;
}


/* =========================
   DIAGNOSTIKA
========================= */

#diagnostics {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 80px;

    max-height: 150px;

    overflow-y: auto;

    padding: 9px 11px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.88);

    border:
        1px solid
        rgba(0,255,255,.25);

    color:
        rgba(255,255,255,.65);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size: 10px;

    line-height: 1.4;

    z-index: 100;

    display: none;
}

#diagnostics.show {
    display: block;
}

.diag-error {
    color: #ff5555;
}

.diag-ok {
    color: #55ffcc;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>
</head>

<script type="module">

/* ==================================================
   JARVIS – WEBLLM
================================================== */

import {
    CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";


/* ==================================================
   ELEMENTY
================================================== */

const core =
document.getElementById("core");

const status =
document.getElementById("status");

const response =
document.getElementById("response");

const recognized =
document.getElementById("recognized");

const textBox =
document.getElementById("textBox");

const sendButton =
document.getElementById("sendButton");

const micButton =
document.getElementById("micButton");

const diagnostics =
document.getElementById("diagnostics");


/* ==================================================
   DIAGNOSTIKA
================================================== */

let diagnosticVisible = true;

diagnostics.classList.add("show");


function log(message, type = "") {

    const time =
        new Date().toLocaleTimeString(
            "cs-CZ"
        );

    const line =
        document.createElement("div");

    line.textContent =
        `[${time}] ${message}`;

    if (type === "error")
        line.className = "diag-error";

    if (type === "ok")
        line.className = "diag-ok";

    diagnostics.appendChild(line);

    diagnostics.scrollTop =
        diagnostics.scrollHeight;

    console.log(message);
}


window.addEventListener(
    "error",
    event => {

        log(
            "JS ERROR: " +
            event.message,
            "error"
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        log(
            "PROMISE ERROR: " +
            (
                event.reason?.message ||
                String(event.reason)
            ),
            "error"
        );
    }
);


/* ==================================================
   KULIČKA
================================================== */

let rotation1 = 0;
let rotation2 = 0;
let lastTime =
performance.now();


function animate(time) {

    const delta =
        (time - lastTime) / 1000;

    lastTime = time;

    rotation1 +=
        45 * delta;

    rotation2 -=
        72 * delta;

    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            .55
        ) *
        .05;

    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );

    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );

    core.style.setProperty(
        "--pulse",
        pulse
    );

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);


/* ==================================================
   WEBGPU TEST
================================================== */

async function testWebGPU() {

    log(
        "Spouštím WebGPU test..."
    );

    if (!navigator.gpu) {

        log(
            "WebGPU není dostupné.",
            "error"
        );

        throw new Error(
            "WebGPU není dostupné."
        );
    }

    const adapter =
        await navigator.gpu.requestAdapter({
            powerPreference:
                "high-performance"
        });

    if (!adapter) {

        log(
            "GPU adaptér nebyl nalezen.",
            "error"
        );

        throw new Error(
            "GPU adaptér nebyl nalezen."
        );
    }

    log(
        "GPU adapter OK",
        "ok"
    );

    log(
        "GPU vendor: " +
        (
            adapter.info?.vendor ||
            "unknown"
        ),
        "ok"
    );

    log(
        "GPU architecture: " +
        (
            adapter.info?.architecture ||
            "unknown"
        ),
        "ok"
    );

    log(
        "GPU device: " +
        (
            adapter.info?.device ||
            "unknown"
        ),
        "ok"
    );

    const device =
        await adapter.requestDevice();

    if (!device) {

        log(
            "GPU device se nepodařilo vytvořit.",
            "error"
        );

        throw new Error(
            "GPU device chyba."
        );
    }

    log(
        "GPU device OK",
        "ok"
    );

    const buffer =
        device.createBuffer({

            size: 256,

            usage:
                GPUBufferUsage.STORAGE |
                GPUBufferUsage.COPY_DST
        });

    buffer.destroy();

    log(
        "GPU buffer test OK",
        "ok"
    );

    log(
        "WEBGPU TEST CELKEM OK",
        "ok"
    );

    return true;
}


/* ==================================================
   AI ENGINE
================================================== */

let engine = null;

let modelReady = false;

let loading = false;


/*
 * Qwen2.5 0.5B Instruct
 *
 * Malý model vhodný pro první test
 * lokálního JARVISe.
 */

const MODEL =
    "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";


/* ==================================================
   NAČTENÍ MODELU
================================================== */

async function loadModel() {

    if (loading)
        return;

    if (modelReady)
        return;

    loading = true;

    status.textContent =
        "NAČÍTÁM MOZEK";

    response.textContent =
        "Stahuji lokální model…";

    log(
        "Začínám načítat model:"
    );

    log(
        MODEL
    );

    try {

        /*
         * WebLLM si model po prvním
         * stažení ukládá do cache.
         */

        engine =
            await CreateMLCEngine(
                MODEL,
                {

                    initProgressCallback:
                    progress => {

                        const text =
                            progress?.text ||
                            "";

                        log(
                            text
                        );

                        if (
                            progress &&
                            typeof progress.progress ===
                            "number"
                        ) {

                            const percent =
                                Math.round(
                                    progress.progress *
                                    100
                                );

                            status.textContent =
                                "MOZEK " +
                                percent +
                                "%";

                            response.textContent =
                                "Načítám lokální AI…\n" +
                                percent +
                                "%";
                        }
                    }

                }
            );


        modelReady = true;

        status.textContent =
            "JARVIS PŘIPRAVEN";

        response.textContent =
            "Lokální AI je připravená.";

        log(
            "MODEL ÚSPĚŠNĚ NAČTEN",
            "ok"
        );

        log(
            "JARVIS je připraven.",
            "ok"
        );

    } catch (error) {

        modelReady = false;

        status.textContent =
            "CHYBA MODELU";

        response.textContent =
            "Lokální model se nepodařilo načíst.\n\n" +
            (
                error?.message ||
                String(error)
            );

        log(
            "MODEL ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );

        console.error(
            error
        );

    } finally {

        loading = false;
    }
}


/* ==================================================
   JARVIS ODPOVĚĎ
================================================== */

async function askJarvis(text) {

    if (!text)
        return;

    recognized.textContent =
        text;

    if (!modelReady) {

        response.textContent =
            "Mozek ještě není připraven.";

        log(
            "Požadavek odmítnut – model není načten.",
            "error"
        );

        return;
    }

    status.textContent =
        "JARVIS PŘEMÝŠLÍ";

    response.textContent =
        "Přemýšlím…";

    log(
        "Odesílám dotaz modelu."
    );

    try {

        const result =
            await engine.chat.completions.create({

                messages: [

                    {
                        role: "system",

                        content:
                            "Jsi JARVIS, osobní AI asistent. " +
                            "Odpovídej stručně, přirozeně a česky. " +
                            "Mluv jako technologicky vyspělý osobní asistent."
                    },

                    {
                        role: "user",

                        content:
                            text
                    }

                ],

                temperature: 0.7,

                max_tokens: 180

            });


        const answer =
            result
            ?.choices?.[0]
            ?.message?.content
            ?.trim();


        if (!answer) {

            throw new Error(
                "Model nevrátil žádnou odpověď."
            );
        }


        response.textContent =
            answer;

        status.textContent =
            "JARVIS ODPOVÍDÁ";

        log(
            "Odpověď přijata.",
            "ok"
        );


        speak(answer);

    } catch (error) {

        status.textContent =
            "CHYBA ODPOVĚDI";

        response.textContent =
            "Nepodařilo se získat odpověď.\n\n" +
            (
                error?.message ||
                String(error)
            );

        log(
            "INFERENCE ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );
    }
}


/* ==================================================
   PSANÍ
================================================== */

sendButton.addEventListener(
    "click",
    async () => {

        const text =
            textBox.value.trim();

        if (!text)
            return;

        textBox.value = "";

        await askJarvis(text);
    }
);


textBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    }
);


/* ==================================================
   MIKROFON
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "cs-CZ";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening = true;

        status.textContent =
            "POSLOUCHÁM";

        micButton.classList.add(
            "listening"
        );

        log(
            "Mikrofon spuštěn."
        );
    };


    recognition.onresult =
    event => {

        let text = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            text +=
                event.results[i][0]
                .transcript;
        }

        if (text.trim()) {

            recognized.textContent =
                text;

            if (
                event.results[
                    event.results.length - 1
                ].isFinal
            ) {

                askJarvis(
                    text.trim()
                );
            }
        }
    };


    recognition.onend =
    () => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        if (modelReady) {

            status.textContent =
                "JARVIS PŘIPRAVEN";
        }

        log(
            "Mikrofon ukončen."
        );
    };


    recognition.onerror =
    event => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        log(
            "MIC ERROR: " +
            event.error,
            "error"
        );
    };
}


micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            response.textContent =
                "Diktování není v tomto prohlížeči dostupné.";

            return;
        }

        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                log(
                    "MIC START ERROR: " +
                    error.message,
                    "error"
                );
            }
        }
    }
);


/* ==================================================
   HLAS
================================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    )
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "cs-CZ";

    utterance.rate =
        0.48;

    utterance.pitch =
        0.85;

    utterance.volume =
        1.0;

    speechSynthesis.speak(
        utterance
    );
}

async function startJarvis() {

    try {

        status.textContent =
            "TESTUJI GPU";

        response.textContent =
            "Kontroluji WebGPU…";

        await testWebGPU();

        status.textContent =
            "NAČÍTÁM MOZEK";

        response.textContent =
            "WebGPU funguje.\n\n" +
            "Připravuji Qwen2.5 0.5B…";

        await loadModel();

    } catch (error) {

        status.textContent =
            "CHYBA";

        response.textContent =
            error?.message ||
            String(error);

        log(
            "START ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );
    }
}


startJarvis();
