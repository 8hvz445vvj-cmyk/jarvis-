<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black">

<meta name="apple-mobile-web-app-title"
      content="JARVIS">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100dvh;

    background: #000;

    display: flex;
    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 0 18px;

    overflow: hidden;
}

.top-space {
    flex: 1;
}


/* =========================
   JARVIS CORE
========================= */

.core {
    position: relative;

    width: min(300px, 78vw);
    height: min(300px, 78vw);

    flex-shrink: 0;

    --r1: 0deg;
    --r2: 0deg;
    --pulse: 1;
}

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.35),
            rgba(0,100,255,.12) 40%,
            transparent 68%
        );
}

.ring {
    position: absolute;

    left: 50%;
    top: 50%;
}

.outer {
    width: 285px;
    height: 285px;

    transform:
        translate(-50%, -50%);
}

.outer circle {
    fill: none;

    stroke:
        rgba(0,255,255,.35);

    stroke-width: 1;
}

.outer-segment,
.outer-segment-2,
.outer-segment-3 {
    width: 270px;
    height: 270px;
}

.outer-segment {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.outer-segment-2 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.outer-segment-3 {
    transform:
        translate(-50%, -50%)
        rotate(var(--r1));
}

.middle {
    width: 205px;
    height: 205px;

    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.middle circle {
    fill: none;

    stroke:
        rgba(0,255,255,.65);

    stroke-width: 2;
}

.inner,
.inner-2 {
    width: 190px;
    height: 190px;
}

.inner {
    transform:
        translate(-50%, -50%)
        rotate(var(--r2));
}

.inner-2 {
    transform:
        translate(-50%, -50%)
        rotate(
            calc(var(--r1) * -1)
        );
}

.center-glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        scale(var(--pulse));

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff,
            cyan 20%,
            rgba(0,100,255,.8) 48%,
            transparent 72%
        );
}

.core-center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 35px rgba(0,255,255,.8);
}


/* =========================
   TEXT
========================= */

.title {
    margin-top: 8px;

    font-size: 42px;

    font-weight: 300;

    letter-spacing: 10px;

    color: white;
}

.status {
    margin-top: 5px;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;

    color:
        rgba(0,255,255,.8);
}

.recognized {
    margin-top: 17px;

    width: 100%;
    max-width: 420px;

    min-height: 44px;

    font-size: 17px;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(255,255,255,.9);

    overflow-y: auto;
}

.response {
    margin-top: 7px;

    width: 100%;
    max-width: 430px;

    max-height: 110px;

    overflow-y: auto;

    font-size: 18px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    color:
        rgba(0,255,255,.95);

    white-space: pre-wrap;
}


/* =========================
   INPUT
========================= */

.bottom-space {
    flex: 1;
}

.input-area {
    width: 100%;

    max-width: 520px;

    display: flex;

    align-items: flex-end;

    gap: 9px;

    padding-bottom: 15px;
}

.text-box {
    flex: 1;

    min-width: 0;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding:
        14px 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family: inherit;

    font-size: 16px;

    line-height: 21px;
}

.text-box::placeholder {
    color:
        rgba(255,255,255,.45);
}

.button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(0,255,255,.55);

    cursor: pointer;
}

.button:active {
    transform: scale(.92);
}

.mic.listening {
    background:
        rgba(0,140,255,.25);

    border-color: cyan;

    box-shadow:
        0 0 15px
        rgba(0,255,255,.5);
}

.mic-svg {
    width: 24px;
    height: 24px;

    fill: none;

    stroke: white;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.send {
    border: none;

    background:
        #087cff;

    font-size: 24px;
}


/* =========================
   DIAGNOSTIKA
========================= */

#diagnostics {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 80px;

    max-height: 180px;

    overflow-y: auto;

    padding: 10px 12px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.92);

    border:
        1px solid
        rgba(0,255,255,.30);

    color:
        rgba(255,255,255,.72);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size: 10px;

    line-height: 1.45;

    z-index: 100;

    display: block;

    -webkit-overflow-scrolling: touch;
}

.diag-title {
    color: cyan;

    font-size: 11px;

    margin-bottom: 5px;
}

.diag-error {
    color: #ff5555;
}

.diag-ok {
    color: #55ffcc;
}

.diag-warn {
    color: #ffd166;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .core {
        width: 245px;
        height: 245px;
    }

    .outer {
        width: 235px;
        height: 235px;
    }

    .outer-segment,
    .outer-segment-2,
    .outer-segment-3 {
        width: 225px;
        height: 225px;
    }

    .middle {
        width: 165px;
        height: 165px;
    }

    .inner,
    .inner-2 {
        width: 153px;
        height: 153px;
    }

    .center-glow {
        width: 105px;
        height: 105px;
    }

    .title {
        font-size: 36px;
    }
}

</style>
</head>


<body>

<div class="app">

<div class="main">

<div class="top-space"></div>


<!-- JARVIS CORE -->

<div class="core" id="core">

<div class="glow"></div>


<svg
class="ring outer"
viewBox="0 0 285 285">

<circle
cx="142.5"
cy="142.5"
r="142">
</circle>

</svg>


<svg
class="ring outer-segment"
viewBox="0 0 270 270">

<circle
cx="135"
cy="135"
r="128"
fill="none"
stroke="rgba(0,255,255,.9)"
stroke-width="3"
stroke-linecap="round"
stroke-dasharray="185 815"
pathLength="1000">
</circle>

</svg>


<svg
class="ring outer-segment-2"
viewBox="0 0 270 270">

<circle
cx="135"
cy="135"
r="128"
fill="none"
stroke="rgba(0,255,255,.8)"
stroke-width="2"
stroke-linecap="round"
stroke-dasharray="125 875"
stroke-dashoffset="-480"
pathLength="1000">
</circle>

</svg>


<svg
class="ring outer-segment-3"
viewBox="0 0 270 270">

<circle
cx="135"
cy="135"
r="128"
fill="none"
stroke="rgba(40,120,255,.9)"
stroke-width="3"
stroke-linecap="round"
stroke-dasharray="100 900"
stroke-dashoffset="-780"
pathLength="1000">
</circle>

</svg>


<svg
class="ring middle"
viewBox="0 0 205 205">

<circle
cx="102.5"
cy="102.5"
r="100">
</circle>

</svg>


<svg
class="ring inner"
viewBox="0 0 190 190">

<circle
cx="95"
cy="95"
r="92"
fill="none"
stroke="rgba(0,120,255,.9)"
stroke-width="4"
stroke-linecap="round"
stroke-dasharray="150 850"
stroke-dashoffset="-120"
pathLength="1000">
</circle>

</svg>


<svg
class="ring inner-2"
viewBox="0 0 190 190">

<circle
cx="95"
cy="95"
r="92"
fill="none"
stroke="rgba(0,255,255,.7)"
stroke-width="2"
stroke-linecap="round"
stroke-dasharray="155 845"
stroke-dashoffset="-580"
pathLength="1000">
</circle>

</svg>


<div class="center-glow"></div>

<div class="core-center"></div>

</div>


<div class="title">
JARVIS
</div>


<div
class="status"

DIAGNOSTIKA
</div>


<div

id="recognized">
ŘEKNI NĚCO…
</div>

Kontroluji systém…
</div>


<div class="bottom-space"></div>


<!-- INPUT -->

<div class="input-area">

<textarea
id="textBox"
class="text-box"
rows="1"

</textarea>

id="micButton"

viewBox="0 0 24 24">

<rect
x="9"

</rect>

<path
d="M5 11a7 7 0 0 0 14 0">
</path>

d="M12 18v3">
</path>

<path
d="M9 21h6">
</path>

</svg>

</button>

id="sendButton"
class="button send"
aria-label="Odeslat">

↑

</button>

</div>

</div>

</div>


<!-- DIAGNOSTIKA -->

<div id="diagnostics">

<div class="diag-title">
JARVIS SYSTEM DIAGNOSTICS
</div>

</div>


<script>

/* ==================================================
   JARVIS STABILNÍ DIAGNOSTICKÁ VERZE
   BEZ WEBLLM
   BEZ EXTERNÍHO IMPORTU
================================================== */

"use strict";


/* ==================================================
   ELEMENTY
================================================== */

const core =
    document.getElementById("core");

const status =
    document.getElementById("status");

const response =
    document.getElementById("response");

const recognized =
    document.getElementById("recognized");

const textBox =
    document.getElementById("textBox");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const diagnostics =
    document.getElementById("diagnostics");


/* ==================================================
   DIAGNOSTIKA
================================================== */

function log(message, type = "") {

    const line =
        document.createElement("div");

    const time =
        new Date().toLocaleTimeString(
            "cs-CZ"
        );

    line.textContent =
        "[" + time + "] " + message;

    if (type === "error") {
        line.className =
            "diag-error";
    }

    if (type === "ok") {
        line.className =
            "diag-ok";
    }

    if (type === "warn") {
        line.className =
            "diag-warn";
    }

    diagnostics.appendChild(line);

    diagnostics.scrollTop =
        diagnostics.scrollHeight;

    console.log(
        "[JARVIS]",
        message
    );
}


/* ==================================================
   CHYTÁNÍ JAVASCRIPT CHYB
================================================== */

window.addEventListener(
    "error",
    event => {

        log(
            "JS ERROR: " +
            event.message +
            " | řádek " +
            event.lineno,
            "error"
        );

    }
);


/* ==================================================
   CHYTÁNÍ PROMISE CHYB
================================================== */

window.addEventListener(
    "unhandledrejection",
    event => {

        const reason =
            event.reason;

        log(
            "PROMISE ERROR: " +
            (
                reason?.message ||
                String(reason)
            ),
            "error"
        );

    }
);


/* ==================================================
   CHYTÁNÍ CHYB NAČÍTÁNÍ
================================================== */

window.addEventListener(
    "error",
    event => {

        const target =
            event.target;

        if (
            target &&
            target !== window
        ) {

            const name =
                target.tagName ||
                "UNKNOWN";

            const source =
                target.src ||
                target.href ||
                "";

            log(
                "LOAD ERROR: " +
                name +
                " " +
                source,
                "error"
            );
        }

    },
    true
);


/* ==================================================
   START
================================================== */

log(
    "JARVIS se spouští..."
);


/* ==================================================
   KULIČKA
================================================== */

let rotation1 = 0;

let rotation2 = 0;

let lastTime =
    performance.now();


function animate(time) {

    const delta =
        (time - lastTime) / 1000;

    lastTime =
        time;


    rotation1 +=
        45 * delta;

    rotation2 -=
        72 * delta;


    const pulse =
        1 +
        Math.sin(
            time / 1000 *
            Math.PI *
            0.55
        ) *
        0.05;


    core.style.setProperty(
        "--r1",
        rotation1 + "deg"
    );

    core.style.setProperty(
        "--r2",
        rotation2 + "deg"
    );

    core.style.setProperty(
        "--pulse",
        pulse
    );


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


log(
    "Animace JARVIS CORE OK",
    "ok"
);


/* ==================================================
   WEBGPU DIAGNOSTIKA
================================================== */

async function checkWebGPU() {

    log(
        "Kontroluji WebGPU..."
    );


    if (
        !("gpu" in navigator)
    ) {

        log(
            "WebGPU API není dostupné.",
            "warn"
        );

        return false;
    }


    log(
        "WebGPU API nalezeno.",
        "ok"
    );


    try {

        const adapter =
            await navigator.gpu.requestAdapter({
                powerPreference:
                    "high-performance"
            });


        if (!adapter) {

            log(
                "WebGPU adaptér nebyl nalezen.",
                "warn"
            );

            return false;
        }


        log(
            "WebGPU adaptér OK.",
            "ok"
        );


        if (adapter.info) {

            log(
                "GPU vendor: " +
                (
                    adapter.info.vendor ||
                    "unknown"
                )
            );

            log(
                "GPU architecture: " +
                (
                    adapter.info.architecture ||
                    "unknown"
                )
            );

            log(
                "GPU device: " +
                (
                    adapter.info.device ||
                    "unknown"
                )
            );
        }


        const device =
            await adapter.requestDevice();


        if (!device) {

            log(
                "GPU device se nepodařilo vytvořit.",
                "error"
            );

            return false;
        }


        log(
            "WebGPU device OK.",
            "ok"
        );


        device.destroy?.();


        log(
            "WebGPU test dokončen.",
            "ok"
        );


        return true;

    } catch (error) {

        log(
            "WebGPU ERROR: " +
            (
                error?.message ||
                String(error)
            ),
            "error"
        );

        return false;
    }
}


/* ==================================================
   SPEECH RECOGNITION
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    log(
        "Speech Recognition API nalezeno.",
        "ok"
    );


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "cs-CZ";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
    () => {

        isListening =
            true;

        status.textContent =
            "POSLOUCHÁM";

        micButton.classList.add(
            "listening"
        );

        log(
            "Mikrofon spuštěn.",
            "ok"
        );
    };


    recognition.onresult =
    event => {

        let text = "";


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            text +=
                event.results[i][0]
                    .transcript;
        }


        if (text.trim()) {

            recognized.textContent =
                text;

        }

    };


    recognition.onend =
    () => {

        isListening =
            false;

        micButton.classList.remove(
            "listening"
        );

        status.textContent =
            "JARVIS PŘIPRAVEN";

        log(
            "Mikrofon ukončen."
        );
    };


    recognition.onerror =
    event => {

        isListening =
            false;

        micButton.classList.remove(
            "listening"
        );

        status.textContent =
            "CHYBA MIKROFONU";

        log(
            "MIC ERROR: " +
            event.error,
            "error"
        );
    };

} else {

    log(
        "Speech Recognition není v tomto prohlížeči dostupné.",
        "warn"
    );
}


/* ==================================================
   MIKROFON BUTTON
================================================== */

micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            response.textContent =
                "Diktování není v tomto prohlížeči dostupné.";

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                log(
                    "MIC START ERROR: " +
                    error.message,
                    "error"
                );
            }
        }

    }
);


/* ==================================================
   TEXTOVÝ VSTUP
================================================== */

function handleText(text) {

    if (!text)
        return;


    recognized.textContent =
        text;


    status.textContent =
        "JARVIS";


    /*
     * Zatím žádný lokální model.
     *
     * Tohle je záměrné.
     * Nechceme znovu spustit problém
     * s WebLLM a nekonečným stahováním.
     */

    response.textContent =
        "Systém funguje.\n\n" +
        "Jádro JARVIS je připravené.\n" +
        "AI model zatím není připojen.";


    log(
        "Přijat text: " +
        text,
        "ok"
    );
}


/* ==================================================
   SEND
================================================== */

sendButton.addEventListener(
    "click",
    () => {

        const text =
            textBox.value.trim();


        if (!text)
            return;


        textBox.value =
            "";


        handleText(
            text
        );

    }
);


/* ==================================================
   ENTER
================================================== */

textBox.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }

    }
);


/* ==================================================
   TEXTAREA AUTO HEIGHT
================================================== */

textBox.addEventListener(
    "input",
    () => {

        textBox.style.height =
            "auto";

        textBox.style.height =
            Math.min(
                textBox.scrollHeight,
                110
            ) + "px";

    }
);


/* ==================================================
   START DIAGNOSTIKY
================================================== */

async function startDiagnostics() {

    status.textContent =
        "DIAGNOSTIKA";

    response.textContent =
        "Kontroluji systém…";


    log(
        "HTML stránka načtena.",
        "ok"
    );


    log(
        "JavaScript spuštěn.",
        "ok"
    );


    log(
        "WebLLM: VYPNUTO"
    );


    log(
        "Externí AI import: VYPNUTO"
    );


    log(
        "Model download: VYPNUTO"
    );


    await checkWebGPU();


    status.textContent =
        "JARVIS PŘIPRAVEN";


    response.textContent =
        "Systém JARVIS je připraven.\n\n" +
        "Diagnostika běží.";


    log(
        "START JARVIS DOKONČEN.",
        "ok"
    );

}


startDiagnostics();


</script>

</body>
</html>
